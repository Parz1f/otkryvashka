name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle assembleRelease --no-daemon

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk Otkryvashka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Otkryvashka
          path: Otkryvashka.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Открывашка 1.${{ github.run_number }}
          files: Otkryvashka.apk
          make_latest: true
