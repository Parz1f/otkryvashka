[package]
name = "otkryvashka"
version = "0.1.0"
edition = "2021"
description = "Открывашка: просмотр документов на Android, оболочка на Rust (Tauri)"

[lib]
# Android загружает приложение как динамическую библиотеку
name = "otkryvashka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
otkryvashka-core = { path = "../core" }
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
