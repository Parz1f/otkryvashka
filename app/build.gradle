plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher version number, so a new APK installs over the old one.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'app.otkryvashka'
    compileSdk 34

    defaultConfig {
        applicationId 'app.otkryvashka'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile file('otkryvashka.jks')
            storePassword 'otkryvashka'
            keyAlias 'otkryvashka'
            keyPassword 'otkryvashka'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
